name: Sync Fork Upstream
on:
  workflow_dispatch: # 手动点按钮触发
  schedule:
    - cron: '0 */6 * * *' # 每6小时自动同步一次

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0

      - name: Set git config
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/minyoad/my-iptv.git
          git fetch upstream

      - name: Merge upstream master
        run: |
          git checkout master
          git merge upstream/master --no-edit || true
          # 冲突直接全盘使用上游文件
          if [ "$(git status --porcelain)" ]; then
            echo "发现冲突，采用上游全部文件"
            git checkout --theirs .
            git add .
            git commit -m "自动合并上游更新，解决冲突"
          fi
          git push origin master --force
